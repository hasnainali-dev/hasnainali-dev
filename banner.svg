<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1421"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>

    <!-- Glow for the left bar -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glowBar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0f1c" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Border Glow -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave path glow -->
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot Glow -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2332" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- ===== DECORATIVE ELEMENTS ===== -->

  <!-- Wave path behind text -->
  <path d="M 0 260 Q 150 200 300 260 T 600 260 T 900 260 T 1200 260" 
        fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.5" filter="url(#waveGlow)"/>
  <path d="M 0 280 Q 200 220 400 280 T 800 280 T 1200 280" 
        fill="none" stroke="#152a45" stroke-width="1" opacity="0.4"/>

  <!-- Floating code brackets -->
  <g opacity="0.15" fill="none" stroke="#00d4ff" stroke-width="2">
    <text x="650" y="90" font-family="monospace" font-size="48" stroke="none" fill="#00d4ff" opacity="0.2">&lt;/&gt;</text>
    <text x="1080" y="110" font-family="monospace" font-size="32" stroke="none" fill="#00d4ff" opacity="0.15">{ }</text>
    <text x="670" y="340" font-family="monospace" font-size="28" stroke="none" fill="#00d4ff" opacity="0.12">{ }</text>
  </g>

  <!-- Glowing dots -->
  <circle cx="1100" cy="250" r="4" fill="#00d4ff" opacity="0.6" filter="url(#dotGlow)"/>
  <circle cx="1120" cy="320" r="3" fill="#00d4ff" opacity="0.4" filter="url(#dotGlow)"/>
  <circle cx="80" cy="350" r="3" fill="#0066ff" opacity="0.3" filter="url(#dotGlow)"/>

  <!-- ===== LEFT GLOWING BAR ===== -->
  <rect x="75" y="90" width="24" height="220" rx="12" fill="url(#barGrad)" filter="url(#glowBar)" opacity="0.9"/>
  <circle cx="87" cy="100" r="10" fill="#00d4ff" opacity="0.9" filter="url(#dotGlow)"/>

  <!-- ===== LEFT TEXT BLOCK ===== -->

  <!-- Top small label -->
  <text x="130" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="14" 
        fill="#5a7a9a" letter-spacing="4" font-weight="500">DEVELOPER • BUILDER • CREATOR</text>

  <!-- Main Name -->
  <text x="130" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="62" 
        fill="#ffffff" font-weight="800" letter-spacing="1">Uzair Chand</text>

  <!-- Subtitle -->
  <text x="130" y="250" font-family="'Segoe UI', Arial, sans-serif" font-size="24" 
        fill="#4da6ff" font-weight="600" letter-spacing="1">Full Stack React Developer</text>

  <!-- Divider line -->
  <line x1="130" y1="275" x2="570" y2="275" stroke="#1e3a5f" stroke-width="1" opacity="0.6"/>

  <!-- Tech stack -->
  <text x="130" y="305" font-family="'Segoe UI', Arial, sans-serif" font-size="16" 
        fill="#6b8299" letter-spacing="1">React  /  Next.js  /  Node.js  /  MongoDB</text>

  <!-- ===== RIGHT CODE CARD ===== -->

  <!-- Card shadow/glow -->
  <rect x="720" y="70" width="420" height="270" rx="12" fill="#00d4ff" opacity="0.08" filter="url(#cardGlow)"/>

  <!-- Card background -->
  <rect x="715" y="65" width="420" height="270" rx="10" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" opacity="0.98"/>
  <rect x="715" y="65" width="420" height="270" rx="10" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Window dots -->
  <circle cx="740" cy="88" r="6" fill="#ff5f56"/>
  <circle cx="760" cy="88" r="6" fill="#ffbd2e"/>
  <circle cx="780" cy="88" r="6" fill="#27c93f"/>

  <!-- Window title -->
  <text x="830" y="93" font-family="'Consolas', 'Courier New', monospace" font-size="13" 
        fill="#4a6a8a">uzair@developer</text>

  <!-- Divider under title bar -->
  <line x1="730" y1="105" x2="1120" y2="105" stroke="#1e3a5f" stroke-width="0.5" opacity="0.6"/>

  <!-- Code content -->
  <text x="740" y="140" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#5a7a9a">code</text>
  <line x1="740" y1="150" x2="1110" y2="150" stroke="#1e3a5f" stroke-width="0.5" opacity="0.4"/>

  <!-- Code lines -->
  <text x="740" y="185" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#e0e0e0">
    <tspan fill="#c792ea">const</tspan> <tspan fill="#82aaff">developer</tspan> <tspan fill="#89ddff">=</tspan> <tspan fill="#ffcb6b">{</tspan>
  </text>

  <text x="770" y="215" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#e0e0e0">
    <tspan fill="#c792ea">name</tspan><tspan fill="#89ddff">:</tspan> <tspan fill="#c3e88d">"Uzair"</tspan><tspan fill="#89ddff">,</tspan>
  </text>

  <text x="770" y="243" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#e0e0e0">
    <tspan fill="#c792ea">stack</tspan><tspan fill="#89ddff">:</tspan> <tspan fill="#c3e88d">"Full Stack"</tspan><tspan fill="#89ddff">,</tspan>
  </text>

  <text x="770" y="271" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#e0e0e0">
    <tspan fill="#c792ea">status</tspan><tspan fill="#89ddff">:</tspan> <tspan fill="#c3e88d">"Building..."</tspan>
  </text>

  <text x="740" y="300" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#ffcb6b">}</text>

  <!-- Cursor blink -->
  <rect x="745" y="290" width="2" height="16" fill="#00d4ff" opacity="0.8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== BOTTOM BORDER ACCENT ===== -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#barGrad)" opacity="0.6"/>
</svg>
